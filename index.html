<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="LYA Photo - 家庭照片和视频浏览网站">
    <meta name="theme-color" content="#f6f3ec">
    <meta property="og:title" content="LYA Photo">
    <meta property="og:description" content="lya.net.cn 的家庭照片和视频浏览网站">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lya.net.cn/">
    <title>LYA Photo</title>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://images.pexels.com">
    <link rel="stylesheet" href="styles.css?v=20260807-glass">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="LYA Photo 首页">
        <span class="brand-mark">LYA</span>
        <span class="brand-text">Photo</span>
      </a>

      <div class="header-actions">
        <label class="search-box" aria-label="搜索照片或视频">
          <i data-lucide="search"></i>
          <input id="searchInput" type="search" placeholder="搜索标题、地点、标签">
        </label>
        <button class="icon-button" id="themeToggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </header>

    <main>
      <section class="intro-grid" aria-labelledby="pageTitle">
        <div class="intro-copy">
          <div class="hero-title-block">
            <p class="eyebrow">lya.net.cn</p>
            <h1 id="pageTitle">LYA Photo</h1>
            <p id="siteIntro" class="lead"></p>
          </div>

          <div class="hero-summary" aria-label="相册概览">
            <span class="hero-stat">
              <strong id="heroPhotoCount">0</strong>
              <span>照片</span>
            </span>
            <span class="hero-stat">
              <strong id="heroVideoCount">0</strong>
              <span>视频</span>
            </span>
            <span class="hero-stat">
              <strong id="heroYearRange">--</strong>
              <span>年份</span>
            </span>
          </div>

          <div class="hero-mini-grid" id="heroMiniGrid" aria-label="近期照片预览"></div>
        </div>

        <figure class="feature-photo" id="featurePhoto"></figure>
      </section>

      <section class="toolbar" aria-label="素材筛选">
        <div class="filter-group" id="albumFilters"></div>
        <div class="stats-strip" id="statsStrip"></div>
      </section>

      <section class="gallery-section" aria-live="polite">
        <div class="gallery" id="gallery"></div>
        <p class="empty-state" id="emptyState" hidden>没有找到素材</p>
      </section>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop" data-close></div>
      <article class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
        <button class="icon-button lightbox-close" type="button" aria-label="关闭查看器" title="关闭">
          <i data-lucide="x"></i>
        </button>
        <button class="icon-button lightbox-prev" type="button" aria-label="上一项" title="上一项">
          <i data-lucide="chevron-left"></i>
        </button>
        <div class="lightbox-media" id="lightboxMedia"></div>
        <button class="icon-button lightbox-next" type="button" aria-label="下一项" title="下一项">
          <i data-lucide="chevron-right"></i>
        </button>
        <footer class="lightbox-caption">
          <div>
            <p class="caption-meta" id="lightboxMeta"></p>
            <h2 id="lightboxTitle"></h2>
            <p id="lightboxDesc"></p>
          </div>
          <a class="download-link" id="lightboxLink" href="#" target="_blank" rel="noreferrer">
            <i data-lucide="external-link"></i>
            <span id="lightboxLinkText">查看文件</span>
          </a>
        </footer>
      </article>
    </div>

    <footer class="site-footer">
      <span>© <span id="year"></span> LYA</span>
      <a href="https://lya.net.cn/">lya.net.cn</a>
    </footer>

    <aside class="music-player" aria-label="儿童音乐播放器">
      <div class="music-info">
        <p class="music-label">贝乐虎儿歌</p>
        <p class="music-title" id="musicTitle">准备播放</p>
      </div>
      <div class="music-controls">
        <button class="music-button" id="musicPrev" type="button" aria-label="上一首音乐" title="上一首">
          <i data-lucide="skip-back"></i>
        </button>
        <button class="music-button music-play" id="musicToggle" type="button" aria-label="播放或暂停音乐" title="播放/暂停">
          <i data-lucide="play"></i>
        </button>
        <button class="music-button" id="musicNext" type="button" aria-label="下一首音乐" title="下一首">
          <i data-lucide="skip-forward"></i>
        </button>
      </div>
    </aside>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="photos.js?v=20260630-loading"></script>
    <script src="music.js?v=20260630-loading"></script>
    <script src="app.js?v=20260630-loading"></script>
  </body>
</html>
