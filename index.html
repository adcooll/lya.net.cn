<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="李予安与李予恩的家庭成长相册">
    <meta name="theme-color" content="#f7f7f2">
    <meta property="og:title" content="安与恩｜家庭相册">
    <meta property="og:description" content="李予安与李予恩的照片、视频和共同成长记录">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lya.net.cn/">
    <title>安与恩｜家庭相册</title>
    <link rel="stylesheet" href="styles.css?v=20260812-family">
  </head>
  <body data-view="all">
    <header class="site-header">
      <a class="brand" href="/" aria-label="安与恩家庭相册首页">
        <span class="brand-mark" aria-hidden="true">安恩</span>
        <span class="brand-copy">
          <strong>安与恩</strong>
          <small>Family album</small>
        </span>
      </a>

      <div class="header-actions">
        <label class="search-box" aria-label="搜索照片或视频">
          <i data-lucide="search"></i>
          <input id="searchInput" type="search" placeholder="搜索日期、地点或标题">
        </label>
        <a class="upload-link" href="/upload/" aria-label="上传照片">
          <i data-lucide="upload"></i>
          <span>上传</span>
        </a>
        <button class="icon-button" id="themeToggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <i data-lucide="moon"></i>
        </button>
      </div>
    </header>

    <main>
      <section class="story-hero" aria-labelledby="pageTitle">
        <div class="story-copy">
          <p class="eyebrow" id="viewKicker">两个孩子 · 三本相册</p>
          <h1 id="pageTitle">安与恩</h1>
          <p class="lead" id="siteIntro">把各自的成长与一起走过的日子，放在同一个家里。</p>

          <div class="hero-summary" aria-label="当前相册概览">
            <span class="hero-stat">
              <strong id="heroPhotoCount">0</strong>
              <span>照片</span>
            </span>
            <span class="hero-stat">
              <strong id="heroVideoCount">0</strong>
              <span>视频</span>
            </span>
            <span class="hero-stat">
              <strong id="heroYearRange">--</strong>
              <span>年份</span>
            </span>
          </div>

          <a class="story-jump" href="#album">
            <span>查看当前相册</span>
            <i data-lucide="arrow-down"></i>
          </a>
        </div>

        <figure class="feature-photo" id="featurePhoto" aria-label="相册轮播"></figure>
      </section>

      <nav class="people-nav" id="peopleNav" aria-label="选择成长相册"></nav>

      <section class="album-shell" id="album" aria-labelledby="albumTitle">
        <header class="album-heading">
          <div>
            <p class="section-kicker" id="albumKicker">Family timeline</p>
            <h2 id="albumTitle">全部时光</h2>
          </div>
          <div class="stats-strip" id="statsStrip"></div>
        </header>

        <div class="toolbar" aria-label="素材筛选">
          <div class="filter-group" id="albumFilters"></div>
        </div>

        <div class="gallery" id="gallery" aria-live="polite"></div>
        <div class="empty-state" id="emptyState" hidden>
          <span class="empty-monogram" id="emptyMonogram" aria-hidden="true">安恩</span>
          <h3 id="emptyTitle">这里还没有照片</h3>
          <p id="emptyCopy">下一次上传时选择对应相册，照片就会出现在这里。</p>
          <a class="empty-upload" href="/upload/">
            <i data-lucide="image-plus"></i>
            <span>上传第一张</span>
          </a>
        </div>
      </section>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox-backdrop" data-close></div>
      <article class="lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle">
        <button class="icon-button lightbox-close" type="button" aria-label="关闭查看器" title="关闭">
          <i data-lucide="x"></i>
        </button>
        <button class="icon-button lightbox-prev" type="button" aria-label="上一项" title="上一项">
          <i data-lucide="chevron-left"></i>
        </button>
        <div class="lightbox-media" id="lightboxMedia"></div>
        <button class="icon-button lightbox-next" type="button" aria-label="下一项" title="下一项">
          <i data-lucide="chevron-right"></i>
        </button>
        <footer class="lightbox-caption">
          <div>
            <p class="caption-meta" id="lightboxMeta"></p>
            <h2 id="lightboxTitle"></h2>
            <p id="lightboxDesc"></p>
          </div>
          <a class="download-link" id="lightboxLink" href="#" target="_blank" rel="noreferrer">
            <i data-lucide="external-link"></i>
            <span id="lightboxLinkText">查看文件</span>
          </a>
        </footer>
      </article>
    </div>

    <footer class="site-footer">
      <span>© <span id="year"></span> 安与恩</span>
      <a href="https://lya.net.cn/">lya.net.cn</a>
    </footer>

    <aside class="music-player" aria-label="儿童音乐播放器">
      <button class="music-button" id="musicPrev" type="button" aria-label="上一首音乐" title="上一首">
        <i data-lucide="skip-back"></i>
      </button>
      <button class="music-button music-play" id="musicToggle" type="button" aria-label="播放或暂停音乐" title="播放或暂停">
        <i data-lucide="play"></i>
      </button>
      <div class="music-info">
        <p class="music-label">贝乐虎儿歌</p>
        <p class="music-title" id="musicTitle">准备播放</p>
      </div>
      <button class="music-button" id="musicNext" type="button" aria-label="下一首音乐" title="下一首">
        <i data-lucide="skip-forward"></i>
      </button>
    </aside>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="photos.js?v=20260815-family-photos"></script>
    <script src="music.js?v=20260630-loading"></script>
    <script src="app.js?v=20260814-brand"></script>
  </body>
</html>
